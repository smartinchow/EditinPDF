name: EditinPDF
options:
  bundleIdPrefix: app.editinpdf
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "27.0"
configFiles: { Debug: Config/Base.xcconfig, Release: Config/Base.xcconfig }
packages:
  EditinPDFCore: { path: EditinPDFCore }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The Rust core is built for Apple-silicon simulators only (aarch64-apple-ios-sim), so a Release
    # build for the simulator must not also try an Intel slice.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  EditinPDF:
    type: application
    platform: iOS
    sources:
      - EditinPDF
      # Debug builds only (EXCLUDED_SOURCE_FILE_NAMES below keeps them out of Release): the UI tests'
      # sample documents. A Debug build launched with `-openFixture <name>` copies one into its
      # Documents folder for the test to open (App/FixtureStaging.swift). They stay in the UI tests'
      # folder, where the Rust fixture exporter writes them, so there is one copy of each; it is the
      # app that carries them, not the UI-test bundle. Check a Release build's .app for *.pdf after
      # touching this.
      - { path: EditinPDFUITests/Fixtures, buildPhase: resources }
    dependencies: [{ package: EditinPDFCore }, { sdk: PencilKit.framework }, { sdk: MessageUI.framework }]
    info:
      path: EditinPDF/Info.plist
      properties:
        CFBundleDisplayName: EditinPDF
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - { CFBundleTypeName: PDF, CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [com.adobe.pdf] }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # Nothing in the UI tests' Fixtures folder ships: not the documents there today, and not one
          # added later. (The pattern is matched against the file's whole path.)
          EXCLUDED_SOURCE_FILE_NAMES: "*/EditinPDFUITests/Fixtures/*"
  EditinPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EditinPDFTests]
    dependencies: [{ target: EditinPDF }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).tests"
        GENERATE_INFOPLIST_FILE: YES
  EditinPDFUITests:
    type: bundle.ui-testing
    platform: iOS
    # The sample documents in Fixtures belong to the app (see its sources); the tests never read them.
    sources: [{ path: EditinPDFUITests, excludes: [Fixtures] }]
    dependencies: [{ target: EditinPDF }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).uitests"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EditinPDF:
    build: { targets: { EditinPDF: all } }
    run: { config: Debug }
    test: { config: Debug, targets: [EditinPDFTests, EditinPDFUITests] }
